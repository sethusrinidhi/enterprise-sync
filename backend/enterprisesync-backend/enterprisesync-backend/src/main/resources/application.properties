spring.application.name=enterprisesync-backend
server.port=8080

# --- PRODUCTION / LOCAL MYSQL CONFIGURATION ---
spring.datasource.url=jdbc:mysql://localhost:3306/enterprisesync_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Custom Properties
jwt.secret=development-secret-key-change-me
jwt.expiration=86400000

# (Optional H2 memory database lines kept commented out)
# spring.datasource.url=jdbc:h2:mem:enterprisesync_db;MODE=MySQL;...